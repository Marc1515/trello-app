services:
  trello-app:
    build: .
    container_name: trello-app
    restart: unless-stopped
    env_file:
      - .env
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      trello-postgres:
        condition: service_healthy
    networks:
      - trello-network
      - traefik-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-proxy"
      - "traefik.http.routers.trello.rule=Host(`trello.marcespana.com`)"
      - "traefik.http.routers.trello.entrypoints=websecure"
      - "traefik.http.routers.trello.tls.certresolver=letsencrypt"
      - "traefik.http.services.trello.loadbalancer.server.port=3000"

  trello-postgres:
    image: postgres:16-alpine
    container_name: trello-postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      POSTGRES_USER: trello_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: trello_db
    volumes:
      - trello_postgres_data:/var/lib/postgresql/data
    networks:
      - trello-network

volumes:
  trello_postgres_data:

networks:
  trello-network:
    driver: bridge
    internal: true
  traefik-proxy:
    external: true
